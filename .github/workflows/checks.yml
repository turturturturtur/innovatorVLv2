name: Static checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check case-player.js
          node --check app.js
          node --check intro.js
          node --check particles.js
      - name: Check commit whitespace
        run: git show --format= --check HEAD
